# Publica no PyPI quando uma tag vX.Y.Z é criada neste repositório (pelo sdks/mirror.sh do monorepo).
# Sem token: o PyPI confia neste workflow (trusted publishing), no environment pypi.
name: publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: A tag tem de ser a versão do pyproject.toml e do pacote
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME"
          test "$(python -c 'from sharpfy_nextapi._version import VERSION; print(VERSION)')" = "$v"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
